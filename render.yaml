# Render Blueprint: one web service (API + web app) and a managed Postgres database.
# Deploy: Render dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: care-marketplace
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: care-marketplace-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STATIC_DIR
        value: ../frontend/dist
      - key: TRUST_PROXY
        value: "true"
      - key: PAYMENT_GATEWAY
        value: mock
      - key: PLATFORM_FEE_PERCENT
        value: "15"
      # Loads demo providers and accounts on first start only (never overwrites data).
      # Set to "false" and change the admin password before real users sign up.
      - key: SEED_DEMO_DATA
        value: "true"

databases:
  - name: care-marketplace-db
    plan: free
